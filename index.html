<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <meta
    name="description"
    content="Inspect Android and iOS crash JSON and view formatted stack traces."
  />

  <title>Crash Stack Trace Viewer</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">

    <header class="app-header">
      <div>
        <h1>Crash Stack Trace Viewer</h1>
        <p>Paste crash JSON to inspect application and thread stack traces.</p>
      </div>
    </header>

    <section class="card editor-card" aria-labelledby="jsonHeading">
      <div class="section-header">
        <div>
          <h2 id="jsonHeading">Crash JSON</h2>
          <p>Paste the crash report JSON below.</p>
        </div>

        <button
          id="exampleBtn"
          class="btn btn-secondary"
          type="button"
        >
          Load Example
        </button>
      </div>

      <textarea
        id="jsonInput"
        spellcheck="false"
        autocomplete="off"
        aria-label="Crash report JSON"
        placeholder="Paste crash JSON here..."
      ></textarea>

      <div class="editor-footer">
        <span
          id="jsonStatus"
          class="status"
          role="status"
          aria-live="polite"
        >
          Ready
        </span>

        <div class="actions">
          <button
            id="clearBtn"
            class="btn btn-secondary"
            type="button"
          >
            Clear
          </button>

          <button
            id="formatBtn"
            class="btn btn-primary"
            type="button"
          >
            Format Stack Trace
          </button>
        </div>
      </div>
    </section>

    <div
      id="errorMessage"
      class="error-message hidden"
      role="alert"
    ></div>

    <section
      id="result"
      class="card result-card hidden"
      aria-labelledby="resultHeading"
    >
      <div class="result-header">
        <div>
          <h2 id="resultHeading">Crash Details</h2>
          <p>Application and thread information</p>
        </div>

        <div class="result-actions">
          <button
            id="expandAllBtn"
            class="btn btn-secondary"
            type="button"
          >
            Expand All
          </button>

          <button
            id="collapseAllBtn"
            class="btn btn-secondary"
            type="button"
          >
            Collapse All
          </button>
        </div>
      </div>

      <div id="meta" class="meta-grid"></div>

      <div id="threads" class="thread-list"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
